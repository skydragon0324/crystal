<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="A clear sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(208, 84%, 40%)"/>
      <stop offset="34%" stop-color="hsl(206, 82%, 50%)"/>
      <stop offset="66%" stop-color="hsl(201, 86%, 68%)"/>
      <stop offset="100%" stop-color="hsl(196, 92%, 88%)"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.5)"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#sky)"/>

  <!-- The haze that reads as distance, thickest at the horizon. -->
  <rect y="260" width="1600" height="240" fill="url(#haze)"/>

  <!-- A low sun, well clear of the aeroplane and the strapline. -->
  <circle cx="304" cy="165" r="38" fill="rgba(255,255,255,0.3)"/>
  <circle cx="304" cy="165" r="21" fill="rgba(255,255,255,0.72)"/>
</svg>
