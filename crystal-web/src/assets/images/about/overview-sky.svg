<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="A clear sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(206, 82%, 46%)"/>
      <stop offset="55%" stop-color="hsl(201, 86%, 66%)"/>
      <stop offset="100%" stop-color="hsl(196, 92%, 86%)"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.55)"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#sky)"/>
  <!-- The haze that reads as distance, thickest at the horizon. -->
  <rect y="300" width="1600" height="200" fill="url(#haze)"/>
  <!-- A low sun, well off to the right of where the plane will stop. -->
  <circle cx="1320" cy="150" r="54" fill="rgba(255,255,255,0.35)"/>
  <circle cx="1320" cy="150" r="30" fill="rgba(255,255,255,0.72)"/>
</svg>
