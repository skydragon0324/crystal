# =====================================================================
# An addition to deploy/nginx.conf, for the transition period:
#
#   PHONES GET crystal-web, DESKTOPS KEEP THE ORIGINAL SITE.
#
# (The desktop certificate sign-in needs nothing from nginx: the certificate
# agent runs on the member's own PC and signs a challenge the API issues -
# see X509_* in crystal-backend/.env.example.)
#
# A REFERENCE, NOT A DROP-IN. The mobile paths and the upstream
# of your original site are placeholders - every one is marked CHANGE.
# =====================================================================


# ---------------------------------------------------------------------
# WHO IS ON A PHONE
#
# Decided HERE, once, by the User-Agent - not by a script on the original
# site's homepage. The script version works but costs every phone a full
# load of the desktop page before it is sent away, depends on JavaScript
# running, and puts a second copy of the "is this a phone" rule somewhere
# nobody will remember to update.
#
# Phones only. Tablets keep the desktop site: they have the width for it,
# and crystal-web is being brought in for the phone view first.
#
# NOTE ON iPADS: since iPadOS 13 Safari sends a DESKTOP User-Agent
# ("Macintosh"), so an iPad is indistinguishable from a Mac here and gets the
# desktop site. That is the right answer for a tablet anyway.
#
# These `map` blocks belong in the http {} context, beside the server blocks.
# ---------------------------------------------------------------------
map $http_user_agent $crystal_phone {
    default                                               0;
    "~*iphone|ipod"                                       1;
    "~*android.*mobile"                                   1;
    "~*windows phone|iemobile|blackberry|bb10|opera mini" 1;
    "~*\bmobile\b"                                        1;
}

# THE ESCAPE HATCH. A link on either site can set crystal_site=desktop (or
# =mobile) so somebody on a phone can still reach the full original site, and
# the reverse. The cookie wins over the User-Agent.
map "$cookie_crystal_site:$crystal_phone" $crystal_send_to_mobile {
    default       0;
    "~^mobile:"   1;
    "~^desktop:"  0;
    ":1"          1;
}

# WHERE A PHONE LANDS. The original site's paths do not exist in crystal-web,
# so sending /some/old/page to /crystal_web/some/old/page would be a 404
# screen. Map the ones that have an equivalent; everything else goes to the
# home page. CHANGE: add your original site's real paths.
map $uri $crystal_mobile_target {
    default        /crystal_web/;
    /              /crystal_web/;
    /login         /crystal_web/login;
    /about         /crystal_web/about;
    /support       /crystal_web/support;
}


server {
    # ... everything in deploy/nginx.conf stays as it is: /api/, /uploads/,
    # /crystal_web/, /crystal_admin/ ...

    # -----------------------------------------------------------------
    # THE ORIGINAL SITE, for everything crystal-web does not own.
    #
    # This REPLACES the two catch-alls at the bottom of deploy/nginx.conf
    # (`location = /` redirecting to /crystal_web/, and `location /`
    # answering 404) for as long as the original site is still in service.
    #
    # `if` with `return` is the one use of `if` inside a location that nginx
    # documents as safe; it is the combination with proxy_pass and try_files
    # that misbehaves, and there is none here.
    # -----------------------------------------------------------------
    location / {
        if ($crystal_send_to_mobile) {
            return 302 $crystal_mobile_target;
        }

        # CHANGE: wherever the original site runs.
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # THE SAME URL NOW ANSWERS DIFFERENTLY BY DEVICE. A cache or CDN in
        # front of this must key on the User-Agent and the escape-hatch cookie,
        # or it will store a phone's redirect and serve it to every desktop.
        add_header Vary "User-Agent, Cookie" always;
    }

    # WHEN THE DESKTOP MOVES TO crystal-web TOO: delete `location /` above and
    # restore the two catch-alls from deploy/nginx.conf. Nothing else changes -
    # crystal-web already lives at /crystal_web/ for both.
}
