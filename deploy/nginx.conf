# Keep a small pool of warm connections to Node. Without this, every API
# request can pay for a new upstream TCP connection even though the browser's
# connection to nginx itself is persistent.
upstream crystal_backend {
    server 127.0.0.1:5400;
    keepalive 32;
}

# =====================================================================
# Crystal behind one nginx, on one machine.
#
#   /crystal_web/    the customer website   (crystal-web/build)
#   /crystal_admin/  the operations console (crystal-admin/build)
#   /api/            the backend            (crystal-backend on :5400)
#   /uploads/        files the backend wrote
#
# THREE THINGS HAVE TO AGREE, and getting any one of them wrong produces a
# different, confusing symptom:
#
#   1. WHERE THE ASSETS ARE. Each frontend is built with PUBLIC_URL set to its
#      prefix, so index.html asks for /crystal_admin/static/js/main.js rather
#      than /static/js/main.js. Build it without and the page loads a white
#      screen with 404s for its own bundle.
#
#   2. WHERE THE ROUTER THINKS IT IS. <BrowserRouter basename> is read from the
#      same PUBLIC_URL (see each project's src/App.js). Miss this and the
#      bundle loads correctly and then matches no route at all: the browser is
#      at /crystal_admin/admin and the Switch is looking for /admin.
#
#   3. WHERE THE API IS. REACT_APP_API_URL is set to the PATH /api, not to a
#      host - so the browser calls the same origin it loaded from and there is
#      no CORS, no preflight, and nothing to reconfigure when the hostname
#      changes. Both projects derive the /uploads base by stripping /api off
#      it, so a path works there too.
#
# BUILD LIKE THIS (the prefix appears twice on purpose - assets and router):
#
#   cd crystal-web
#   PUBLIC_URL=/crystal_web REACT_APP_API_URL=/api npm run build
#
#   cd crystal-admin
#   PUBLIC_URL=/crystal_admin REACT_APP_API_URL=/api npm run build
#
# On Windows PowerShell:
#
#   $env:PUBLIC_URL="/crystal_web"; $env:REACT_APP_API_URL="/api"; npm run build
#
# NOT in Git Bash / MSYS without a guard. It rewrites any value that looks
# like a unix path, so PUBLIC_URL=/crystal_web arrives as
# C:/Program Files/Git/crystal_web and the built index.html asks for its
# bundle from there. Verified the hard way. Use PowerShell, or:
#
#   MSYS_NO_PATHCONV=1 PUBLIC_URL=/crystal_web npm run build
#
# Then point the roots below at the two build folders and reload nginx.
# =====================================================================

server {
    listen       80;
    server_name  _;

    # Uploaded images are the largest thing this site serves.
    client_max_body_size 25m;

    # Let the kernel move static bundles and images directly from disk to the
    # socket, without copying every byte through nginx's userspace buffers.
    sendfile   on;
    tcp_nopush on;

    # ------------------------------------------------------------------
    # gzip
    #
    # The JS bundle is the reason: ~300KB uncompressed, ~90KB gzipped, and it
    # is on the critical path of every first visit. `gzip_static off` because
    # CRA does not emit .gz files - nginx compresses on the fly.
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      image/svg+xml;

    # ------------------------------------------------------------------
    # THE API
    #
    # Declared BEFORE the two SPA prefixes. nginx picks the longest matching
    # prefix rather than the first, so order is not what saves us here - but
    # keeping the proxy above the static roots is how anybody reading this
    # file finds it.
    #
    # The trailing slashes MATCH on both sides: `location /api/` with
    # `proxy_pass http://.../api/` passes the path through unchanged. Drop the
    # slash from one side only and every route arrives at the backend with
    # /api doubled or missing.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://crystal_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # The backend reads the real client address for its rate limiter and
        # its audit log. Without these it sees 127.0.0.1 for every request and
        # rate-limits the whole internet as one visitor.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long enough for an Excel export of a large table, which is the
        # slowest thing the console asks for.
        proxy_read_timeout 120s;

        # Normal API replies are JSON or complete download buffers. Buffering
        # lets Node finish quickly even when a client reads slowly, freeing
        # its event-loop connection for the next request.
        proxy_buffering    on;
    }

    # ------------------------------------------------------------------
    # UPLOADS, served by nginx rather than proxied.
    #
    # These are static files the backend wrote to disk. Proxying them means
    # every product photograph on a catalogue page occupies a node process for
    # the duration of its transfer, for no benefit - nginx serves a file
    # better than express does.
    #
    # `alias` rather than `root`: the URL is /uploads/x.svg and the file is
    # <backend>/uploads/x.svg, so the location is not a prefix of the path on
    # disk and `root` would look for <backend>/uploads/uploads/x.svg.
    #
    # POINT THIS AT crystal-backend/uploads.
    # ------------------------------------------------------------------
    location /uploads/ {
        alias /srv/crystal/crystal-backend/uploads/;

        # A year, because an upload's name never changes - a replacement is a
        # new file with a new name. `immutable` stops the conditional request
        # a revalidation would otherwise cost.
        expires    1y;
        add_header Cache-Control "public, immutable";

        # A missing image is a missing image, not the SPA's index.html - which
        # is what a shared try_files would serve, and it renders as a broken
        # picture with a 200 that nobody can debug.
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # THE CUSTOMER WEBSITE
    # ------------------------------------------------------------------
    location /crystal_web/ {
        alias /srv/crystal/crystal-web/build/;

        # EVERY UNKNOWN PATH IS THE APP, because the routing is client-side:
        # /crystal_web/about is a React route, not a file. The fallback names
        # the index of THIS prefix - a shared /index.html would serve the
        # console's HTML under the website's URL.
        try_files $uri $uri/ /crystal_web/index.html;

        # The bundle is content-hashed, so it can be cached forever. index.html
        # is NOT - it is the file that names the current bundle, and caching it
        # is how a browser keeps loading last week's app after a deploy.
        location ~* ^/crystal_web/static/ {
            alias /srv/crystal/crystal-web/build/static/;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # The HTML names the current content-hashed chunks. Revalidate it on every
    # visit so a deployment cannot strand a browser on deleted old chunks.
    location = /crystal_web/index.html {
        alias /srv/crystal/crystal-web/build/index.html;
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------------
    # THE OPERATIONS CONSOLE
    #
    # Identical in shape, and deliberately not factored into a shared block:
    # the two differ only in their prefix and their root, and an include with
    # two variables is harder to read than fifteen repeated lines.
    # ------------------------------------------------------------------
    location /crystal_admin/ {
        alias /srv/crystal/crystal-admin/build/;
        try_files $uri $uri/ /crystal_admin/index.html;

        location ~* ^/crystal_admin/static/ {
            alias /srv/crystal/crystal-admin/build/static/;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # The console is not for the public. Uncomment to restrict it to the
        # office network - it is the one part of this deployment where a wrong
        # answer is somebody else's data.
        # allow 10.0.0.0/8;
        # deny  all;
    }

    location = /crystal_admin/index.html {
        alias /srv/crystal/crystal-admin/build/index.html;
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------------
    # THE ROOT
    #
    # Neither app is served from / - both live under a prefix - so somebody
    # typing the bare hostname is sent to the website. A redirect rather than
    # an alias, so the address bar shows where they actually are and a
    # bookmark from here works.
    # ------------------------------------------------------------------
    location = / {
        return 302 /crystal_web/;
    }

    # Anything else is genuinely not here. Without this, an unmatched path
    # falls through to nginx's default root and answers with its welcome page,
    # which looks like the deployment is broken in a different way than it is.
    location / {
        return 404;
    }
}
